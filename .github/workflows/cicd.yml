name: CI/CD - avaliacaoDevOps (Case 5 AguaViva)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: avaliacaodevops

jobs:
  # CI: Integração Contínua 
  ci:
    name: CI - Validar, Build e Testar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar arquivos do projeto
        run: |
          test -f index.html  || (echo "index.html não encontrado" && exit 1)
          test -f Dockerfile  || (echo "Dockerfile não encontrado" && exit 1)
          grep -qi "<!DOCTYPE html>" index.html || (echo "HTML sem DOCTYPE" && exit 1)
          grep -q "</html>" index.html          || (echo "HTML incompleto" && exit 1)
          grep -q "INSTANCE_LABEL" index.html   || (echo "INSTANCE_LABEL ausente" && exit 1)
          echo "Validação OK"

      - name: Build da imagem Docker
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Testar container (smoke test)
        run: |
          docker run -d --name teste -p 8080:80 $IMAGE_NAME:${{ github.sha }}
          sleep 5
          curl -fsS http://localhost:8080 | grep -q "INSTANCE_LABEL"
          echo "Container respondeu corretamente"
          docker rm -f teste

  # CD: Deploy Contínuo
  cd:
    name: CD - Deploy na EC2
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/avaliacaoDevOps
            git pull origin main
            docker build -t avaliacaodevops:latest .
            docker rm -f avaliacaodevops || true
            docker run -d --name avaliacaodevops --restart always -p 80:80 avaliacaodevops:latest
            sleep 5
            curl -fsS http://localhost/ > /dev/null
            echo "Deploy concluído - commit ${{ github.sha }}"

      - name: Verificar página publicada
        run: curl -fsS http://${{ secrets.EC2_HOST }}/ > /dev/null && echo "Página no ar"